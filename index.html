<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Little Planet Hopper</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background: #101820;
      color: #f5f1df;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    main { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #172b3b; }
    canvas { display: block; width: 100%; height: 100%; }
    .in-menu .hud, .in-menu .score, .in-menu .hint { display: none; }
    .menu-screen { position: absolute; inset: 0; pointer-events: none; }
    .menu-screen[hidden] { display: none; }
    .menu-card {
      position: absolute; left: 50%; bottom: clamp(14px, 3vh, 34px); transform: translateX(-50%);
      width: clamp(150px, 23vh, 210px); aspect-ratio: 1; display: grid; place-items: center;
      padding: 18px; border: 1px solid #f2d9a477; border-radius: 12px;
      background: #182a32e8; box-shadow: 0 16px 60px #09131999, inset 0 1px #fff2d222;
      backdrop-filter: blur(8px); pointer-events: auto;
    }
    .menu-card button { width: 100%; padding: 13px 8px; white-space: nowrap; }
    .hud {
      position: absolute; top: clamp(18px, 5vh, 48px); left: clamp(20px, 5vw, 64px);
      pointer-events: none; text-shadow: 0 2px 8px #10202b;
    }
    .eyebrow { margin: 0 0 8px; color: #f1a66a; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(20px, 3vw, 34px); letter-spacing: -.06em; font-weight: 700; }
    .score {
      position: absolute; top: clamp(20px, 5vh, 48px); right: clamp(20px, 5vw, 64px);
      color: #fff4d2; font-size: clamp(13px, 2vw, 18px); letter-spacing: .12em;
      text-shadow: 0 2px 8px #10202b; font-variant-numeric: tabular-nums; pointer-events: none;
    }
    .hint {
      position: absolute; right: clamp(20px, 5vw, 64px); bottom: clamp(22px, 5vh, 48px);
      color: #d1dfd9; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
      display: flex; align-items: center; gap: 11px; pointer-events: none;
    }
    .keys { display: grid; gap: 3px; }
    .key { border: 1px solid #a7c2bd88; border-radius: 4px; width: 25px; height: 22px; display: grid; place-items: center; color: #fff4d5; font-size: 12px; }
    .game-over {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: #101820b8; backdrop-filter: blur(5px); text-align: center;
    }
    .game-over[hidden] { display: none; }
    .card { padding: 36px clamp(26px, 7vw, 72px); border: 1px solid #e5c58a66; border-radius: 12px; background: #1a2b34ed; box-shadow: 0 18px 70px #09131988; }
    .card p { margin: 0 0 22px; color: #f7e9c8; font-size: clamp(20px, 4vw, 34px); font-weight: 700; }
    button { border: 0; border-radius: 6px; padding: 12px 22px; color: #1d2b30; background: #f1b66e; font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
    button:hover { background: #ffd08d; }
    button:focus-visible { outline: 3px solid #fff4d2; outline-offset: 4px; }
  </style>
</head>
<body>
  <main aria-label="A tiny endless spaceship platformer">
    <canvas id="game" aria-label="Use the up and down arrow keys to fly the spaceship"></canvas>
    <header class="hud">
      <p class="eyebrow">A tiny endless journey</p>
      <h1>Little Planet Hopper</h1>
    </header>
    <div class="score" id="score" aria-live="polite">SCORE 00000</div>
    <div class="hint"><span>Fly</span><span class="keys"><span class="key">↑</span><span class="key">↓</span></span></div>
    <section class="menu-screen" id="menu-screen" aria-label="Main menu">
      <div class="menu-card"><button id="start-game" type="button">START UFOING</button></div>
    </section>
    <section class="game-over" id="game-over" hidden aria-live="polite">
      <div class="card"><p>You are now property of Area 51</p><button id="restart" type="button">Restart</button></div>
    </section>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector('#game');
      const ctx = canvas.getContext('2d');
      let w = 0, h = 0, dpr = 1, groundY = 0, elapsed = 0, last = 0;
      let shipY = 0, ended = false, mode = 'menu', menuElapsed = 0, nextMenuHelicopter = 0;
      let score = 0, survivalTime = 0;
      const keys = new Set();
      const stars = Array.from({ length: 70 }, (_, i) => ({
        x: (i * 197.3) % 1200, y: (i * 83.7) % 540,
        r: i % 9 === 0 ? 1.8 : 1.1, phase: i * 1.7
      }));
      const rocks = [];
      let nextRock = 0;
      const helicopters = [];
      let nextHelicopter = 2;
      const explosions = [];
      const debris = [];
      const gameOver = document.querySelector('#game-over');
      const scoreDisplay = document.querySelector('#score');
      const menuScreen = document.querySelector('#menu-screen');
      const difficulty = () => 1.5 + elapsed * .025;
      document.body.classList.add('in-menu');

      function addScore(points) {
        score += points;
        scoreDisplay.textContent = `SCORE ${String(score).padStart(5, '0')}`;
      }

      function restart() {
        mode = 'game'; menuScreen.hidden = true; document.body.classList.remove('in-menu');
        ended = false;
        elapsed = 0; last = 0; shipY = h * .49;
        score = 0; survivalTime = 0; addScore(0);
        rocks.length = 0; helicopters.length = 0; explosions.length = 0; debris.length = 0; nextRock = .4; nextHelicopter = 1.5;
        gameOver.hidden = true;
        keys.clear();
      }
      document.querySelector('#restart').addEventListener('click', restart);
      document.querySelector('#start-game').addEventListener('click', restart);

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth; h = window.innerHeight;
        canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        groundY = h * 0.76;
        if (!shipY) shipY = h * 0.49;
      }
      window.addEventListener('resize', resize);
      resize();

      window.addEventListener('keydown', e => {
        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); keys.add(e.key); }
      });
      window.addEventListener('keyup', e => keys.delete(e.key));
      window.addEventListener('blur', () => keys.clear());

      function drawBackground(dt) {
        const sky = ctx.createLinearGradient(0, 0, 0, groundY);
        sky.addColorStop(0, '#182d40'); sky.addColorStop(1, '#536f78');
        ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);
        // Soft distant planetary glow
        const glow = ctx.createRadialGradient(w * .77, h * .24, 10, w * .77, h * .24, h * .32);
        glow.addColorStop(0, '#f3b7733a'); glow.addColorStop(1, '#f3b77300');
        ctx.fillStyle = glow; ctx.fillRect(0, 0, w, groundY);
        for (const s of stars) {
          const x = ((s.x / 1200) * w + elapsed * (s.r * 2 + 3)) % (w + 5);
          ctx.globalAlpha = .35 + Math.sin(elapsed * 1.4 + s.phase) * .2;
          ctx.fillStyle = '#fff4db'; ctx.beginPath(); ctx.arc(x, (s.y / 540) * groundY, s.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        // Distant low hills
        ctx.fillStyle = '#354e57'; ctx.beginPath(); ctx.moveTo(0, groundY);
        for (let x = 0; x <= w + 20; x += 20) {
          const y = groundY - 30 - Math.sin((x + elapsed * 9) * .004) * 18 - Math.sin((x + elapsed * 5) * .011) * 8;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(w, groundY); ctx.closePath(); ctx.fill();
      }

      function drawGround(dt) {
        const ground = ctx.createLinearGradient(0, groundY, 0, h);
        ground.addColorStop(0, '#b88358'); ground.addColorStop(.12, '#a46d4c'); ground.addColorStop(1, '#704b3d');
        ctx.fillStyle = ground; ctx.fillRect(0, groundY, w, h - groundY);
        ctx.fillStyle = '#e2ad70'; ctx.fillRect(0, groundY, w, 5);
        // Fine bands drift with the terrain for a sense of motion.
        ctx.globalAlpha = .16; ctx.strokeStyle = '#f3c68e'; ctx.lineWidth = 1;
        const drift = (elapsed * 62) % 72;
        for (let y = groundY + 22; y < h; y += 32) {
          ctx.beginPath(); ctx.moveTo(-72 - drift, y); ctx.lineTo(w, y); ctx.stroke();
        }
        ctx.globalAlpha = 1;
        if (!ended && elapsed > nextRock) {
          const size = 12 + Math.random() * 21;
          rocks.push({ x: w + size, size, shade: Math.random() });
          nextRock = elapsed + (.48 + Math.random() * .58) / difficulty();
        }
        for (let i = rocks.length - 1; i >= 0; i--) {
          const r = rocks[i]; r.x -= 155 * difficulty() * dt;
          const x = r.x, y = groundY - 2, s = r.size;
          ctx.fillStyle = ['#75584b', '#85634c', '#685249'][Math.floor(r.shade * 3)];
          ctx.beginPath(); ctx.moveTo(x - s * .65, y); ctx.lineTo(x - s * .46, y - s * .55);
          ctx.lineTo(x - s * .05, y - s * .78); ctx.lineTo(x + s * .45, y - s * .6);
          ctx.lineTo(x + s * .68, y); ctx.closePath(); ctx.fill();
          ctx.strokeStyle = '#c18a5e'; ctx.globalAlpha = .55; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(x - s * .46, y - s * .55); ctx.lineTo(x - s * .05, y - s * .78); ctx.lineTo(x + s * .1, y - s * .55); ctx.stroke();
          ctx.globalAlpha = 1;
          if (r.x < -50) rocks.splice(i, 1);
        }
      }

      function drawShip(xOverride, yOverride) {
        const x = xOverride ?? Math.max(82, Math.min(130, w * .12));
        const y = yOverride ?? shipY;
        // Small warm engine trail
        const flicker = 22 + Math.sin(elapsed * 23) * 6;
        const flame = ctx.createLinearGradient(x - 24 - flicker, y, x - 18, y);
        flame.addColorStop(0, '#f18d55'); flame.addColorStop(1, '#ffd58a');
        ctx.fillStyle = flame; ctx.beginPath(); ctx.moveTo(x - 24, y - 9); ctx.lineTo(x - 24 - flicker, y); ctx.lineTo(x - 24, y + 9); ctx.closePath(); ctx.fill();
        ctx.save(); ctx.translate(x, y); ctx.rotate(-.05);
        ctx.shadowColor = '#d6f4ed'; ctx.shadowBlur = 20;
        const body = ctx.createLinearGradient(0, -18, 0, 18);
        body.addColorStop(0, '#fff8dc'); body.addColorStop(.52, '#d6e9db'); body.addColorStop(1, '#91b3b2');
        ctx.fillStyle = body; ctx.strokeStyle = '#fff4d2'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.ellipse(0, 0, 31, 17, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#76aab0'; ctx.beginPath(); ctx.ellipse(8, -2, 10, 7, -.15, Math.PI, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = .7; ctx.strokeStyle = '#fff8df'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(0, 0, 25, 12, 0, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
        ctx.restore();
      }

      function spawnCrashDebris(heli) {
        debris.push({
          kind: 'rotor', x: heli.x, y: heli.drawY - 18,
          vx: (Math.random() - .5) * 90, vy: -75 - Math.random() * 65,
          gravity: 235, angle: Math.random() * Math.PI, spin: (Math.random() < .5 ? -1 : 1) * (9 + Math.random() * 7),
          age: 0, grounded: false
        });
        for (let i = 0; i < 7; i++) {
          debris.push({
            kind: 'shard', x: heli.x + (Math.random() - .5) * 28, y: heli.drawY + (Math.random() - .5) * 18,
            vx: (Math.random() - .5) * 260, vy: -60 - Math.random() * 200,
            gravity: 300, angle: Math.random() * Math.PI * 2, spin: (Math.random() - .5) * 18,
            size: 3 + Math.random() * 4, age: 0, grounded: false
          });
        }
      }

      function drawDebris(dt) {
        for (let i = debris.length - 1; i >= 0; i--) {
          const piece = debris[i];
          piece.age += dt;
          const groundSpeed = 155 * difficulty();
          if (!piece.grounded) {
            piece.x += (piece.vx * .25 - groundSpeed * .5) * dt;
            piece.y += piece.vy * dt;
            piece.vy += piece.gravity * dt;
            piece.angle += piece.spin * dt;
            if (piece.kind === 'rotor') {
              piece.spin = Math.sign(piece.spin) * Math.max(0, Math.abs(piece.spin) - 5 * dt);
            }
            if (piece.y >= groundY - 4) {
              piece.y = groundY - 4; piece.vy = 0; piece.vx *= .35; piece.grounded = true;
            }
          } else {
            piece.x -= groundSpeed * dt;
            if (piece.kind === 'rotor') {
              piece.angle += piece.spin * dt;
              piece.spin = Math.sign(piece.spin) * Math.max(0, Math.abs(piece.spin) - 7 * dt);
            }
          }
          if ((piece.kind === 'rotor' && piece.grounded && piece.spin === 0 && piece.age > 1.8) || piece.age > 4 || piece.x < -40 || piece.x > w + 40) {
            debris.splice(i, 1); continue;
          }
          const fade = piece.age > 2.8 ? Math.max(0, (4 - piece.age) / 1.2) : 1;
          ctx.save(); ctx.translate(piece.x, piece.y); ctx.rotate(piece.angle); ctx.globalAlpha = fade;
          if (piece.kind === 'rotor') {
            ctx.strokeStyle = '#e5dfc8'; ctx.lineWidth = 3; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(-24, 0); ctx.lineTo(24, 0); ctx.moveTo(0, -3); ctx.lineTo(0, 3); ctx.stroke();
            ctx.fillStyle = '#495256'; ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();
          } else {
            ctx.fillStyle = i % 2 ? '#d8b77e' : '#77858a';
            ctx.beginPath(); ctx.moveTo(-piece.size, -piece.size * .4); ctx.lineTo(piece.size * .8, -piece.size);
            ctx.lineTo(piece.size, piece.size * .55); ctx.lineTo(-piece.size * .4, piece.size); ctx.closePath(); ctx.fill();
          }
          ctx.restore();
        }
      }

      function drawHelicopterSprite(heli, y = heli.drawY, faceRight = false) {
        ctx.save(); ctx.translate(heli.x, y); ctx.scale(faceRight ? 1 : -1, 1);
        ctx.strokeStyle = '#27333a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-21, 1); ctx.lineTo(-39, -3); ctx.lineTo(-43, -8); ctx.moveTo(-38, -3); ctx.lineTo(-38, 3);
        ctx.moveTo(-12, 11); ctx.lineTo(-12, 15); ctx.lineTo(13, 15); ctx.lineTo(18, 11);
        ctx.moveTo(-6, -12); ctx.lineTo(-6, -17); ctx.moveTo(-27, -18); ctx.lineTo(16, -18);
        ctx.stroke();
        ctx.fillStyle = '#89978a'; ctx.strokeStyle = '#28343a'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(0, 0, 22, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#a9d3ce'; ctx.beginPath(); ctx.ellipse(8, -3, 7, 6, -.2, 0, Math.PI * 2); ctx.fill();
        const rotor = Math.sin(elapsed * 48 + heli.phase) * 8;
        ctx.strokeStyle = '#e5dfc8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-27, -18 - rotor * .15); ctx.lineTo(17, -18 + rotor * .15); ctx.stroke();
        ctx.restore();
      }

      function drawExplosions(dt) {
        for (let i = explosions.length - 1; i >= 0; i--) {
          const blast = explosions[i]; blast.age += dt;
          blast.x -= 155 * difficulty() * .5 * dt;
          if (blast.age >= .42) { explosions.splice(i, 1); continue; }
          const progress = blast.age / .42;
          ctx.globalAlpha = 1 - progress;
          ctx.fillStyle = '#ffd078'; ctx.beginPath(); ctx.arc(blast.x, blast.y, 6 + progress * 22, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#fff0c2'; ctx.lineWidth = 2;
          for (let ray = 0; ray < 8; ray++) {
            const angle = ray * Math.PI / 4 + .2;
            const inner = 10 + progress * 9, outer = inner + 8 * (1 - progress);
            ctx.beginPath(); ctx.moveTo(blast.x + Math.cos(angle) * inner, blast.y + Math.sin(angle) * inner);
            ctx.lineTo(blast.x + Math.cos(angle) * outer, blast.y + Math.sin(angle) * outer); ctx.stroke();
          }
          ctx.globalAlpha = 1;
        }
      }

      function drawHelicopters(dt) {
        if (!ended && elapsed > nextHelicopter) {
          const spawnX = w + 45;
          let spawnY = null, spawnPhase = 0;
          // Try several heights, and skip this spawn if every spot is occupied.
          for (let attempt = 0; attempt < 24; attempt++) {
            const candidateY = 92 + Math.random() * Math.max(60, groundY - 190);
            const candidatePhase = Math.random() * Math.PI * 2;
            const candidateBob = Math.sin(elapsed * 3 + candidatePhase) * 4;
            const wouldTouch = helicopters.some(heli =>
              Math.abs(heli.x - spawnX) < 52 &&
              Math.abs((heli.y + Math.sin(elapsed * 3 + heli.phase) * 4) - (candidateY + candidateBob)) < 40
            );
            if (!wouldTouch) { spawnY = candidateY; spawnPhase = candidatePhase; break; }
          }
          if (spawnY !== null) {
            helicopters.push({
              x: spawnX, y: spawnY, phase: spawnPhase,
              speed: 95 + Math.random() * 125,
              trackRate: .42 + Math.random() * .68
            });
          }
          nextHelicopter = elapsed + Math.max(.32, (2.5 + Math.random() * 2.2) / difficulty());
        }
        const shipX = Math.max(82, Math.min(130, w * .12));
        for (const heli of helicopters) {
          if (!ended) {
            heli.x -= heli.speed * difficulty() * dt;
            if (heli.x <= w * .5) {
              const tracking = 1 - Math.exp(-heli.trackRate * difficulty() * dt);
              heli.y += (shipY - heli.y) * tracking;
            }
          }
          heli.drawY = heli.y + Math.sin(elapsed * 3 + heli.phase) * 4;
        }

        // Helicopters collide only once they have entered the tracking half of the screen.
        const crashed = new Set();
        let crashEvents = 0;
        for (let i = 0; i < helicopters.length; i++) {
          const first = helicopters[i];
          if (first.x > w * .5) continue;
          for (let j = i + 1; j < helicopters.length; j++) {
            const second = helicopters[j];
            if (second.x > w * .5) continue;
            if (Math.abs(first.x - second.x) < 52 && Math.abs(first.drawY - second.drawY) < 34) {
              crashed.add(first); crashed.add(second);
              crashEvents++;
              explosions.push({ x: (first.x + second.x) / 2, y: (first.drawY + second.drawY) / 2, age: 0 });
            }
          }
        }
        if (crashed.size) {
          addScore(crashEvents * 2);
          for (const heli of crashed) spawnCrashDebris(heli);
          for (let i = helicopters.length - 1; i >= 0; i--) {
            if (crashed.has(helicopters[i])) helicopters.splice(i, 1);
          }
        }

        drawExplosions(dt);

        for (let i = helicopters.length - 1; i >= 0; i--) {
          const heli = helicopters[i];
          const y = heli.drawY;
          drawHelicopterSprite(heli, y);
          if (!ended && Math.abs(heli.x - shipX) < 46 && Math.abs(y - shipY) < 29) {
            ended = true; gameOver.hidden = false; keys.clear();
          }
          if (heli.x < -60) helicopters.splice(i, 1);
        }
      }

      function drawMenuScene(dt) {
        drawBackground(dt); drawGround(dt);
        const shipX = w * .5;
        const shipMenuY = h * .46 + Math.sin(menuElapsed * 1.15) * 17 + Math.sin(menuElapsed * .53) * 6;
        if (menuElapsed >= nextMenuHelicopter) {
          const fromLeft = Math.random() < .5;
          const spawnY = h * (.2 + Math.random() * .48);
          helicopters.push({
            x: fromLeft ? -50 : w + 50,
            y: spawnY,
            phase: Math.random() * Math.PI * 2,
            speed: 115 + Math.random() * 115
          });
          nextMenuHelicopter = menuElapsed + .25 + Math.random() * .35;
        }

        for (const heli of helicopters) {
          const dx = shipX - heli.x, dy = shipMenuY - heli.y;
          const distance = Math.hypot(dx, dy) || 1;
          heli.x += dx / distance * heli.speed * dt;
          heli.y += dy / distance * heli.speed * dt;
          heli.drawY = heli.y + Math.sin(menuElapsed * 3 + heli.phase) * 4;
        }

        const crashed = new Set();
        for (let i = 0; i < helicopters.length; i++) {
          const first = helicopters[i];
          for (let j = i + 1; j < helicopters.length; j++) {
            const second = helicopters[j];
            const separation = Math.hypot(first.x - second.x, first.drawY - second.drawY);
            const firstToShip = Math.hypot(first.x - shipX, first.drawY - shipMenuY);
            const secondToShip = Math.hypot(second.x - shipX, second.drawY - shipMenuY);
            if (separation < 48 && firstToShip > 94 && secondToShip > 94) {
              crashed.add(first); crashed.add(second);
              explosions.push({ x: (first.x + second.x) / 2, y: (first.drawY + second.drawY) / 2, age: 0 });
            }
          }
        }
        for (const heli of helicopters) {
          if (!crashed.has(heli) && Math.hypot(heli.x - shipX, heli.drawY - shipMenuY) < 94) {
            crashed.add(heli);
            explosions.push({ x: heli.x, y: heli.drawY, age: 0 });
          }
        }
        if (crashed.size) {
          for (const heli of crashed) spawnCrashDebris(heli);
          for (let i = helicopters.length - 1; i >= 0; i--) {
            if (crashed.has(helicopters[i])) helicopters.splice(i, 1);
          }
        }

        drawExplosions(dt);
        for (const heli of helicopters) {
          drawHelicopterSprite(heli, heli.drawY, heli.x < shipX);
        }
        drawDebris(dt);
        drawShip(shipX, shipMenuY);
      }

      function frame(now) {
        const dt = ended ? 0 : Math.min((now - (last || now)) / 1000, .04); last = now;
        if (mode === 'menu') {
          menuElapsed += dt; elapsed += dt;
          drawMenuScene(dt);
          requestAnimationFrame(frame);
          return;
        }
        elapsed += dt;
        if (!ended) {
          survivalTime += dt;
          while (survivalTime >= 2) { survivalTime -= 2; addScore(1); }
          const speed = 255 * difficulty() * dt;
          if (keys.has('ArrowUp')) shipY -= speed;
          if (keys.has('ArrowDown')) shipY += speed;
          shipY = Math.max(75, Math.min(groundY - 47, shipY));
        }
        drawBackground(dt); drawGround(dt); drawHelicopters(dt); drawDebris(dt); drawShip();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>

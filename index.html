<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Little Planet Hopper</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background: #101820;
      color: #f5f1df;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    main { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #172b3b; }
    canvas { display: block; width: 100%; height: 100%; }
    .in-menu .hud, .in-menu .score, .in-menu .hint,
    .in-ocean .hud, .in-ocean .hint { display: none; }
    .menu-screen { position: absolute; inset: 0; pointer-events: none; }
    .menu-screen[hidden] { display: none; }
    .menu-card {
      position: absolute; left: 50%; bottom: clamp(14px, 3vh, 34px); transform: translateX(-50%);
      width: min(82vw, 900px); height: clamp(160px, 25vh, 210px); display: grid; place-items: center;
      padding: 24px; border: 1px solid #f2d9a477; border-radius: 12px;
      background: #182a32e8; box-shadow: 0 16px 60px #09131999, inset 0 1px #fff2d222;
      backdrop-filter: blur(8px); pointer-events: auto;
    }
    .menu-card button { width: min(240px, 100%); padding: 15px 12px; white-space: nowrap; }
    .hud {
      position: absolute; top: clamp(18px, 5vh, 48px); left: clamp(20px, 5vw, 64px);
      pointer-events: none; text-shadow: 0 2px 8px #10202b;
    }
    .eyebrow { margin: 0 0 8px; color: #f1a66a; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(20px, 3vw, 34px); letter-spacing: -.06em; font-weight: 700; }
    .score {
      position: absolute; top: clamp(20px, 5vh, 48px); right: clamp(20px, 5vw, 64px);
      color: #fff4d2; font-size: clamp(13px, 2vw, 18px); letter-spacing: .12em;
      text-shadow: 0 2px 8px #10202b; font-variant-numeric: tabular-nums; pointer-events: none;
    }
    .hint {
      position: absolute; right: clamp(20px, 5vw, 64px); bottom: clamp(22px, 5vh, 48px);
      color: #d1dfd9; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
      display: flex; align-items: center; gap: 11px; pointer-events: none;
    }
    .keys { display: grid; gap: 3px; }
    .key { border: 1px solid #a7c2bd88; border-radius: 4px; width: 25px; height: 22px; display: grid; place-items: center; color: #fff4d5; font-size: 12px; }
    .game-over {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: #101820b8; backdrop-filter: blur(5px); text-align: center;
    }
    .game-over[hidden] { display: none; }
    .card { padding: 36px clamp(26px, 7vw, 72px); border: 1px solid #e5c58a66; border-radius: 12px; background: #1a2b34ed; box-shadow: 0 18px 70px #09131988; }
    .card p { margin: 0 0 22px; color: #f7e9c8; font-size: clamp(20px, 4vw, 34px); font-weight: 700; }
    button { border: 0; border-radius: 6px; padding: 12px 22px; color: #1d2b30; background: #f1b66e; font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
    button:hover { background: #ffd08d; }
    button:focus-visible { outline: 3px solid #fff4d2; outline-offset: 4px; }
  </style>
</head>
<body>
  <main aria-label="A tiny endless spaceship platformer">
    <canvas id="game" aria-label="Use the up and down arrow keys to fly the spaceship"></canvas>
    <header class="hud">
      <p class="eyebrow">A tiny endless journey</p>
      <h1>Little Planet Hopper</h1>
    </header>
    <div class="score" id="score" aria-live="polite">SCORE 00000</div>
    <div class="hint"><span>Fly</span><span class="keys"><span class="key">↑</span><span class="key">↓</span></span></div>
    <section class="menu-screen" id="menu-screen" aria-label="Main menu">
      <div class="menu-card"><button id="start-game" type="button">START UFOING</button></div>
    </section>
    <section class="game-over" id="game-over" hidden aria-live="polite">
      <div class="card"><p id="game-over-message">You are now property of Area 51</p><button id="restart" type="button">Restart</button></div>
    </section>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector('#game');
      const ctx = canvas.getContext('2d');
      let w = 0, h = 0, dpr = 1, groundY = 0, elapsed = 0, last = 0;
      let shipY = 0, ended = false, mode = 'menu', menuElapsed = 0, nextMenuHelicopter = 0, portalEntry = null;
      let oceanElapsed = 0, oceanReveal = 1;
      let oceanScroll = 0, oceanShipX = 0, oceanShipY = 0;
      let score = 0, survivalTime = 0;
      const keys = new Set();
      const stars = Array.from({ length: 70 }, (_, i) => ({
        x: (i * 197.3) % 1200, y: (i * 83.7) % 540,
        r: i % 9 === 0 ? 1.8 : 1.1, phase: i * 1.7
      }));
      const rocks = [];
      let nextRock = 0;
      const helicopters = [];
      const jets = [];
      let nextHelicopter = 2;
      let nextJet = 1.5;
      let nextWallTime = 60 + Math.random() * 60;
      let wallSpawned = false, wallSpawnTime = null, wormholeSpawned = false, wormhole = null;
      const explosions = [];
      const debris = [];
      const gameOver = document.querySelector('#game-over');
      const gameOverMessage = document.querySelector('#game-over-message');
      const scoreDisplay = document.querySelector('#score');
      const menuScreen = document.querySelector('#menu-screen');
      const difficulty = () => 1.5 + elapsed * .025;
      const oceanDifficulty = () => 1.5 + oceanElapsed * .025;
      document.body.classList.add('in-menu');

      function addScore(points) {
        score += points;
        scoreDisplay.textContent = `SCORE ${String(score).padStart(5, '0')}`;
      }

      function endGame() {
        ended = true;
        const owner = mode === 'ocean' ? 'You are now property of the U.S. Navy' : 'You are now property of Area 51';
        gameOverMessage.textContent = `${owner} — Final score: ${score}`;
        gameOver.hidden = false;
        keys.clear();
      }

      function restart() {
        mode = 'game'; menuScreen.hidden = true; document.body.classList.remove('in-menu', 'in-ocean');
        ended = false; portalEntry = null;
        elapsed = 0; last = 0; shipY = h * .49;
        score = 0; survivalTime = 0; addScore(0);
        rocks.length = 0; helicopters.length = 0; jets.length = 0; explosions.length = 0; debris.length = 0;
        nextRock = .4; nextHelicopter = 1.5; nextWallTime = 60 + Math.random() * 60; wallSpawned = false;
        nextJet = 1.5;
        wallSpawnTime = null; wormholeSpawned = false; wormhole = null;
        gameOver.hidden = true;
        keys.clear();
      }

      function returnToMenu() {
        mode = 'menu'; menuScreen.hidden = false; document.body.classList.add('in-menu');
        document.body.classList.remove('in-ocean');
        ended = false; portalEntry = null;
        oceanElapsed = 0; oceanReveal = 1;
        elapsed = 0; last = 0; menuElapsed = 0; nextMenuHelicopter = 0;
        shipY = h * .49; survivalTime = 0; score = 0; addScore(0);
        rocks.length = 0; helicopters.length = 0; explosions.length = 0; debris.length = 0;
        nextRock = 0; nextHelicopter = 2; nextWallTime = 60 + Math.random() * 60;
        wallSpawned = false; wallSpawnTime = null; wormholeSpawned = false; wormhole = null;
        gameOver.hidden = true; keys.clear();
      }
      document.querySelector('#restart').addEventListener('click', restart);
      document.querySelector('#start-game').addEventListener('click', restart);

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth; h = window.innerHeight;
        canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        groundY = h * 0.76;
        if (!shipY) shipY = h * 0.49;
        if (wormhole) {
          wormhole.x = Math.max(wormhole.rx, Math.min(w - wormhole.rx, wormhole.x));
          wormhole.y = wormhole.zone === 'ground' ? groundY - 12 : wormhole.ry + 8;
        }
        oceanShipX = Math.max(32, Math.min(w - 32, oceanShipX || w * .5));
        oceanShipY = h * .76;
      }
      window.addEventListener('resize', resize);
      resize();

      window.addEventListener('keydown', e => {
        if (e.key.startsWith('Arrow')) { e.preventDefault(); keys.add(e.key); }
      });
      window.addEventListener('keyup', e => keys.delete(e.key));
      window.addEventListener('blur', () => keys.clear());

      function drawBackground(dt) {
        const sky = ctx.createLinearGradient(0, 0, 0, groundY);
        sky.addColorStop(0, '#182d40'); sky.addColorStop(1, '#536f78');
        ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);
        // Soft distant planetary glow
        const glow = ctx.createRadialGradient(w * .77, h * .24, 10, w * .77, h * .24, h * .32);
        glow.addColorStop(0, '#f3b7733a'); glow.addColorStop(1, '#f3b77300');
        ctx.fillStyle = glow; ctx.fillRect(0, 0, w, groundY);
        for (const s of stars) {
          const x = ((s.x / 1200) * w + elapsed * (s.r * 2 + 3)) % (w + 5);
          ctx.globalAlpha = .35 + Math.sin(elapsed * 1.4 + s.phase) * .2;
          ctx.fillStyle = '#fff4db'; ctx.beginPath(); ctx.arc(x, (s.y / 540) * groundY, s.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        // Distant low hills
        ctx.fillStyle = '#354e57'; ctx.beginPath(); ctx.moveTo(0, groundY);
        for (let x = 0; x <= w + 20; x += 20) {
          const y = groundY - 30 - Math.sin((x + elapsed * 9) * .004) * 18 - Math.sin((x + elapsed * 5) * .011) * 8;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(w, groundY); ctx.closePath(); ctx.fill();
      }

      function drawOcean(dt) {
        oceanElapsed += dt;
        oceanScroll += 162 * (oceanDifficulty() / 1.5) * dt;
        const water = ctx.createLinearGradient(0, 0, w * .18, h);
        water.addColorStop(0, '#173e55'); water.addColorStop(.48, '#24647a'); water.addColorStop(1, '#102f49');
        ctx.fillStyle = water; ctx.fillRect(0, 0, w, h);

        // Gentle diagonal wave bands travel toward the upper-right.
        const spacing = 94;
        const drift = oceanElapsed * 66;
        const firstLane = Math.floor((-h - drift + oceanScroll) / spacing);
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        const waveColors = ['#398196', '#4a91a0', '#67a6ad', '#2e718b'];
        const waveWidths = [6, 9, 5, 8];
        for (let lane = firstLane; lane * spacing + drift < w + oceanScroll; lane++) {
          const crest = lane * spacing + drift;
          // For x - y = crest, keep only the segment inside the canvas.
          const startX = Math.max(0, crest - oceanScroll);
          const endX = Math.min(w, crest + h - oceanScroll);
          if (endX <= startX) continue;
          const points = [];
          const wavePhase = crest * .035 - oceanElapsed * 1.4;
          for (let x = startX; x <= endX + 2; x += 12) {
            const along = x + (x - crest);
            const ripple = Math.sin(along * .012 + wavePhase) * 12 +
              Math.sin(along * .005 - wavePhase * .7) * 5;
            points.push([x, x - crest + ripple + oceanScroll]);
          }
          if (points.length < 2) continue;
          ctx.beginPath(); ctx.moveTo(points[0][0], points[0][1]);
          for (let i = 1; i < points.length; i++) {
            const prev = points[i - 1], point = points[i];
            ctx.quadraticCurveTo((prev[0] + point[0]) / 2, (prev[1] + point[1]) / 2,
              (prev[0] + point[0]) / 2, (prev[1] + point[1]) / 2);
          }
          const lastPoint = points[points.length - 1];
          ctx.lineTo(lastPoint[0], lastPoint[1]);
          const patternIndex = ((lane % waveColors.length) + waveColors.length) % waveColors.length;
          ctx.strokeStyle = waveColors[patternIndex]; ctx.globalAlpha = .3;
          ctx.lineWidth = waveWidths[patternIndex]; ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }

      function drawOceanShip() {
        const x = oceanShipX, y = oceanShipY;
        const flicker = 23 + Math.sin(oceanElapsed * 22) * 5;
        const flame = ctx.createLinearGradient(x, y + 19, x, y + 22 + flicker);
        flame.addColorStop(0, '#ffd58a'); flame.addColorStop(1, '#f18d55');
        ctx.fillStyle = flame; ctx.beginPath();
        ctx.moveTo(x - 9, y + 19); ctx.lineTo(x, y + 22 + flicker); ctx.lineTo(x + 9, y + 19);
        ctx.closePath(); ctx.fill();

        ctx.save();
        ctx.shadowColor = '#d6f4ed'; ctx.shadowBlur = 18;
        const body = ctx.createLinearGradient(x, y - 27, x, y + 27);
        body.addColorStop(0, '#fff8dc'); body.addColorStop(.52, '#d6e9db'); body.addColorStop(1, '#91b3b2');
        ctx.fillStyle = body; ctx.strokeStyle = '#fff4d2'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x, y, 27, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#76aab0'; ctx.beginPath(); ctx.ellipse(x, y - 5, 8, 11, 0, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = .72; ctx.strokeStyle = '#fff8df'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, 22, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
        ctx.restore();
      }

      function drawJet(jet) {
        ctx.save(); ctx.translate(jet.x, jet.y); ctx.rotate(jet.angle || 0);
        ctx.fillStyle = '#172a32'; ctx.globalAlpha = .75;
        ctx.beginPath(); ctx.ellipse(0, 1, 20, 28, 0, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
        const body = ctx.createLinearGradient(-18, 0, 18, 0);
        body.addColorStop(0, '#34433f'); body.addColorStop(.5, '#68736a'); body.addColorStop(1, '#34433f');
        ctx.fillStyle = body; ctx.strokeStyle = '#1b2b30'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, 30); ctx.lineTo(5, 8); ctx.lineTo(28, -9); ctx.lineTo(26, -14);
        ctx.lineTo(7, -7); ctx.lineTo(6, -23); ctx.lineTo(0, -29);
        ctx.lineTo(-6, -23); ctx.lineTo(-7, -7); ctx.lineTo(-26, -14); ctx.lineTo(-28, -9);
        ctx.lineTo(-5, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#344e56'; ctx.strokeStyle = '#87958b'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.ellipse(0, 4, 3.3, 10, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = '#9b9c78'; ctx.globalAlpha = .55; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-19, -10); ctx.lineTo(-7, -6); ctx.moveTo(19, -10); ctx.lineTo(7, -6); ctx.stroke();
        ctx.strokeStyle = '#a2a18a'; ctx.globalAlpha = .7; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-2, -17); ctx.lineTo(2, -17); ctx.stroke();
        ctx.restore();
      }

      function spawnJetSquadron() {
        const count = Math.random() < .5 ? 2 : 3;
        const spacing = Math.min(76, Math.max(54, (w - 80) / (count - 1)));
        const formation = count === 3
          ? [{ x: 0, y: 0 }, { x: -spacing, y: -42 }, { x: spacing, y: -42 }]
          : [{ x: -spacing * .5, y: -22 }, { x: spacing * .5, y: 0 }];
        const halfWidth = spacing * (count - 1) / 2;
        const minCenter = Math.min(w * .5, 40 + halfWidth);
        const maxCenter = Math.max(w * .5, w - 40 - halfWidth);

        for (let attempt = 0; attempt < 24; attempt++) {
          const centerX = minCenter + Math.random() * (maxCenter - minCenter);
          const spawnY = -40;
          const positions = formation.map(slot => ({ x: centerX + slot.x, y: spawnY + slot.y }));
          const overlapsJet = positions.some(position => jets.some(jet =>
            Math.abs(jet.x - position.x) < 54 && Math.abs(jet.y - position.y) < 48
          ));
          if (overlapsJet) continue;

          for (let i = 0; i < positions.length; i++) {
            const position = positions[i];
            jets.push({
              x: position.x, y: position.y,
              speed: 95 + Math.random() * 125,
              trackRate: .42 + Math.random() * .68,
              turnRate: 1.8 + Math.random() * 1.4,
              approachSide: i % 2 === 0 ? 1 : -1,
              approachOffset: 76 + Math.random() * 12,
              angle: 0
            });
          }
          return;
        }
      }

      function drawOceanJets(dt) {
        const level = oceanDifficulty();
        if (!ended && oceanElapsed >= nextJet) {
          spawnJetSquadron();
          nextJet = oceanElapsed + Math.max(.32, (2.5 + Math.random() * 2.2) / level);
        }

        for (const jet of jets) {
          if (!ended) {
            jet.y += jet.speed * level * dt;
            if (jet.y >= h * .5) {
              const tracking = 1 - Math.exp(-jet.trackRate * level * 2 * dt);
              const targetX = Math.max(40, Math.min(w - 40,
                oceanShipX + jet.approachSide * jet.approachOffset));
              const dx = targetX - jet.x;
              jet.x += dx * tracking;
              const targetAngle = Math.atan2(-dx, Math.max(40, oceanShipY - jet.y));
              let angleDifference = (targetAngle - jet.angle + Math.PI * 3) % (Math.PI * 2) - Math.PI;
              jet.angle += angleDifference * (1 - Math.exp(-jet.turnRate * dt));
            }
          }
        }

        const crashed = new Set();
        let crashEvents = 0;
        for (let i = 0; i < jets.length; i++) {
          const first = jets[i];
          if (first.y < h * .5) continue;
          for (let j = i + 1; j < jets.length; j++) {
            const second = jets[j];
            if (second.y < h * .5) continue;
            if (Math.abs(first.x - second.x) < 46 && Math.abs(first.y - second.y) < 44) {
              crashed.add(first); crashed.add(second); crashEvents++;
              explosions.push({ x: (first.x + second.x) / 2, y: (first.y + second.y) / 2, age: 0 });
            }
          }
        }
        if (crashed.size) {
          addScore(crashEvents * 2);
          for (let i = jets.length - 1; i >= 0; i--) {
            if (crashed.has(jets[i])) jets.splice(i, 1);
          }
        }

        for (let i = jets.length - 1; i >= 0; i--) {
          const jet = jets[i];
          drawJet(jet);
          if (!ended && Math.abs(jet.x - oceanShipX) < 42 && Math.abs(jet.y - oceanShipY) < 49) {
            endGame();
          }
          if (jet.y > h + 50) jets.splice(i, 1);
        }
        drawExplosions(dt, 0, 162);
      }

      function drawGround(dt) {
        const ground = ctx.createLinearGradient(0, groundY, 0, h);
        ground.addColorStop(0, '#b88358'); ground.addColorStop(.12, '#a46d4c'); ground.addColorStop(1, '#704b3d');
        ctx.fillStyle = ground; ctx.fillRect(0, groundY, w, h - groundY);
        ctx.fillStyle = '#e2ad70'; ctx.fillRect(0, groundY, w, 5);
        // Fine bands drift with the terrain for a sense of motion.
        ctx.globalAlpha = .16; ctx.strokeStyle = '#f3c68e'; ctx.lineWidth = 1;
        const drift = (elapsed * 62) % 72;
        for (let y = groundY + 22; y < h; y += 32) {
          ctx.beginPath(); ctx.moveTo(-72 - drift, y); ctx.lineTo(w, y); ctx.stroke();
        }
        ctx.globalAlpha = 1;
        if (!ended && elapsed > nextRock) {
          const size = 12 + Math.random() * 21;
          rocks.push({ x: w + size, size, shade: Math.random() });
          nextRock = elapsed + (.48 + Math.random() * .58) / difficulty();
        }
        for (let i = rocks.length - 1; i >= 0; i--) {
          const r = rocks[i]; r.x -= 155 * difficulty() * dt;
          const x = r.x, y = groundY - 2, s = r.size;
          ctx.fillStyle = ['#75584b', '#85634c', '#685249'][Math.floor(r.shade * 3)];
          ctx.beginPath(); ctx.moveTo(x - s * .65, y); ctx.lineTo(x - s * .46, y - s * .55);
          ctx.lineTo(x - s * .05, y - s * .78); ctx.lineTo(x + s * .45, y - s * .6);
          ctx.lineTo(x + s * .68, y); ctx.closePath(); ctx.fill();
          ctx.strokeStyle = '#c18a5e'; ctx.globalAlpha = .55; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(x - s * .46, y - s * .55); ctx.lineTo(x - s * .05, y - s * .78); ctx.lineTo(x + s * .1, y - s * .55); ctx.stroke();
          ctx.globalAlpha = 1;
          if (r.x < -50) rocks.splice(i, 1);
        }
      }

      function drawShip(xOverride, yOverride, scale = 1, alpha = 1) {
        const x = xOverride ?? Math.max(82, Math.min(130, w * .12));
        const y = yOverride ?? shipY;
        ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale); ctx.translate(-x, -y); ctx.globalAlpha = alpha;
        // Small warm engine trail
        const flicker = 22 + Math.sin(elapsed * 23) * 6;
        const flame = ctx.createLinearGradient(x - 24 - flicker, y, x - 18, y);
        flame.addColorStop(0, '#f18d55'); flame.addColorStop(1, '#ffd58a');
        ctx.fillStyle = flame; ctx.beginPath(); ctx.moveTo(x - 24, y - 9); ctx.lineTo(x - 24 - flicker, y); ctx.lineTo(x - 24, y + 9); ctx.closePath(); ctx.fill();
        ctx.save(); ctx.translate(x, y); ctx.rotate(-.05);
        ctx.shadowColor = '#d6f4ed'; ctx.shadowBlur = 20;
        const body = ctx.createLinearGradient(0, -18, 0, 18);
        body.addColorStop(0, '#fff8dc'); body.addColorStop(.52, '#d6e9db'); body.addColorStop(1, '#91b3b2');
        ctx.fillStyle = body; ctx.strokeStyle = '#fff4d2'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.ellipse(0, 0, 31, 17, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#76aab0'; ctx.beginPath(); ctx.ellipse(8, -2, 10, 7, -.15, Math.PI, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = .7; ctx.strokeStyle = '#fff8df'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(0, 0, 25, 12, 0, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
        ctx.restore();
        ctx.restore();
      }

      function spawnCrashDebris(heli) {
        debris.push({
          kind: 'rotor', x: heli.x, y: heli.drawY - 18,
          vx: (Math.random() - .5) * 90, vy: -75 - Math.random() * 65,
          gravity: 235, angle: Math.random() * Math.PI, spin: (Math.random() < .5 ? -1 : 1) * (9 + Math.random() * 7),
          age: 0, grounded: false
        });
        for (let i = 0; i < 7; i++) {
          debris.push({
            kind: 'shard', x: heli.x + (Math.random() - .5) * 28, y: heli.drawY + (Math.random() - .5) * 18,
            vx: (Math.random() - .5) * 260, vy: -60 - Math.random() * 200,
            gravity: 300, angle: Math.random() * Math.PI * 2, spin: (Math.random() - .5) * 18,
            size: 3 + Math.random() * 4, age: 0, grounded: false
          });
        }
      }

      function drawDebris(dt) {
        for (let i = debris.length - 1; i >= 0; i--) {
          const piece = debris[i];
          piece.age += dt;
          const groundSpeed = 155 * difficulty();
          if (!piece.grounded) {
            piece.x += (piece.vx * .25 - groundSpeed * .5) * dt;
            piece.y += piece.vy * dt;
            piece.vy += piece.gravity * dt;
            piece.angle += piece.spin * dt;
            if (piece.kind === 'rotor') {
              piece.spin = Math.sign(piece.spin) * Math.max(0, Math.abs(piece.spin) - 5 * dt);
            }
            if (piece.y >= groundY - 4) {
              piece.y = groundY - 4; piece.vy = 0; piece.vx *= .35; piece.grounded = true;
            }
          } else {
            piece.x -= groundSpeed * dt;
            if (piece.kind === 'rotor') {
              piece.angle += piece.spin * dt;
              piece.spin = Math.sign(piece.spin) * Math.max(0, Math.abs(piece.spin) - 7 * dt);
            }
          }
          if ((piece.kind === 'rotor' && piece.grounded && piece.spin === 0 && piece.age > 1.8) || piece.age > 4 || piece.x < -40 || piece.x > w + 40) {
            debris.splice(i, 1); continue;
          }
          const fade = piece.age > 2.8 ? Math.max(0, (4 - piece.age) / 1.2) : 1;
          ctx.save(); ctx.translate(piece.x, piece.y); ctx.rotate(piece.angle); ctx.globalAlpha = fade;
          if (piece.kind === 'rotor') {
            ctx.strokeStyle = '#e5dfc8'; ctx.lineWidth = 3; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(-24, 0); ctx.lineTo(24, 0); ctx.moveTo(0, -3); ctx.lineTo(0, 3); ctx.stroke();
            ctx.fillStyle = '#495256'; ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();
          } else {
            ctx.fillStyle = i % 2 ? '#d8b77e' : '#77858a';
            ctx.beginPath(); ctx.moveTo(-piece.size, -piece.size * .4); ctx.lineTo(piece.size * .8, -piece.size);
            ctx.lineTo(piece.size, piece.size * .55); ctx.lineTo(-piece.size * .4, piece.size); ctx.closePath(); ctx.fill();
          }
          ctx.restore();
        }
      }

      function drawHelicopterSprite(heli, y = heli.drawY, faceRight = false) {
        ctx.save(); ctx.translate(heli.x, y); ctx.scale(faceRight ? 1 : -1, 1);
        ctx.strokeStyle = '#27333a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-21, 1); ctx.lineTo(-39, -3); ctx.lineTo(-43, -8); ctx.moveTo(-38, -3); ctx.lineTo(-38, 3);
        ctx.moveTo(-12, 11); ctx.lineTo(-12, 15); ctx.lineTo(13, 15); ctx.lineTo(18, 11);
        ctx.moveTo(-6, -12); ctx.lineTo(-6, -17); ctx.moveTo(-27, -18); ctx.lineTo(16, -18);
        ctx.stroke();
        ctx.fillStyle = '#89978a'; ctx.strokeStyle = '#28343a'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(0, 0, 22, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#a9d3ce'; ctx.beginPath(); ctx.ellipse(8, -3, 7, 6, -.2, 0, Math.PI * 2); ctx.fill();
        const rotor = Math.sin(elapsed * 48 + heli.phase) * 8;
        ctx.strokeStyle = '#e5dfc8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-27, -18 - rotor * .15); ctx.lineTo(17, -18 + rotor * .15); ctx.stroke();
        ctx.restore();
      }

      function drawExplosions(dt, driftX = 155 * difficulty() * .5, driftY = 0) {
        for (let i = explosions.length - 1; i >= 0; i--) {
          const blast = explosions[i]; blast.age += dt;
          blast.x -= driftX * dt; blast.y += driftY * dt;
          if (blast.age >= .42) { explosions.splice(i, 1); continue; }
          const progress = blast.age / .42;
          ctx.globalAlpha = 1 - progress;
          ctx.fillStyle = '#ffd078'; ctx.beginPath(); ctx.arc(blast.x, blast.y, 6 + progress * 22, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#fff0c2'; ctx.lineWidth = 2;
          for (let ray = 0; ray < 8; ray++) {
            const angle = ray * Math.PI / 4 + .2;
            const inner = 10 + progress * 9, outer = inner + 8 * (1 - progress);
            ctx.beginPath(); ctx.moveTo(blast.x + Math.cos(angle) * inner, blast.y + Math.sin(angle) * inner);
            ctx.lineTo(blast.x + Math.cos(angle) * outer, blast.y + Math.sin(angle) * outer); ctx.stroke();
          }
          ctx.globalAlpha = 1;
        }
      }

      function spawnWall(columnX) {
        const spacing = 36;
        const firstY = 65;
        const lastAllowedY = groundY - 13;
        const lastPlayerY = Math.max(75, groundY - 47);
        const availableCount = Math.max(1, Math.floor((lastAllowedY - firstY) / spacing) + 1);
        const neededCount = Math.max(1, Math.ceil((lastPlayerY - 29 - firstY) / spacing) + 1);
        const columnCount = Math.min(availableCount, Math.max(15, neededCount));
        for (let row = 0; row < columnCount; row++) {
          helicopters.push({
            x: columnX, y: firstY + row * spacing, phase: 0,
            speed: 155, trackRate: 0, column: true
          });
        }
      }

      function drawHelicopters(dt) {
        if (!ended && elapsed > nextHelicopter) {
          const spawnX = w + 45;
          let spawnY = null, spawnPhase = 0;
          // Try several heights, and skip this spawn if every spot is occupied.
          for (let attempt = 0; attempt < 24; attempt++) {
            const candidateY = 92 + Math.random() * Math.max(60, groundY - 190);
            const candidatePhase = Math.random() * Math.PI * 2;
            const candidateBob = Math.sin(elapsed * 3 + candidatePhase) * 4;
            const wouldTouch = helicopters.some(heli =>
              Math.abs(heli.x - spawnX) < 52 &&
              Math.abs((heli.y + Math.sin(elapsed * 3 + heli.phase) * 4) - (candidateY + candidateBob)) < 40
            );
            if (!wouldTouch) { spawnY = candidateY; spawnPhase = candidatePhase; break; }
          }
          if (spawnY !== null) {
            helicopters.push({
              x: spawnX, y: spawnY, phase: spawnPhase,
              speed: 95 + Math.random() * 125,
              trackRate: .42 + Math.random() * .68
            });
          }
          nextHelicopter = elapsed + Math.max(.32, (2.5 + Math.random() * 2.2) / difficulty());
        }
        if (!ended && !wallSpawned && elapsed >= nextWallTime) {
          const shipX = Math.max(82, Math.min(130, w * .12));
          const minimumRunway = 155 * difficulty() * .8;
          const columnX = Math.max(w + 50, shipX + 46 + minimumRunway);
          spawnWall(columnX);
          wallSpawned = true; wallSpawnTime = elapsed;
        }
        const shipX = Math.max(82, Math.min(130, w * .12));
        for (const heli of helicopters) {
          if (!ended) {
            heli.x -= heli.speed * difficulty() * dt;
            if (!heli.column && heli.x <= w * .5) {
              const tracking = 1 - Math.exp(-heli.trackRate * difficulty() * dt);
              heli.y += (shipY - heli.y) * tracking;
            }
          }
          heli.drawY = heli.y + Math.sin(elapsed * 3 + heli.phase) * 4;
        }

        // Helicopters collide only once they have entered the tracking half of the screen.
        const crashed = new Set();
        let crashEvents = 0;
        for (let i = 0; i < helicopters.length; i++) {
          const first = helicopters[i];
          if (first.column || first.x > w * .5) continue;
          for (let j = i + 1; j < helicopters.length; j++) {
            const second = helicopters[j];
            if (second.column || second.x > w * .5) continue;
            if (Math.abs(first.x - second.x) < 52 && Math.abs(first.drawY - second.drawY) < 34) {
              crashed.add(first); crashed.add(second);
              crashEvents++;
              explosions.push({ x: (first.x + second.x) / 2, y: (first.drawY + second.drawY) / 2, age: 0 });
            }
          }
        }
        if (crashed.size) {
          addScore(crashEvents * 3);
          for (const heli of crashed) spawnCrashDebris(heli);
          for (let i = helicopters.length - 1; i >= 0; i--) {
            if (crashed.has(helicopters[i])) helicopters.splice(i, 1);
          }
        }

        drawExplosions(dt);

        for (let i = helicopters.length - 1; i >= 0; i--) {
          const heli = helicopters[i];
          const y = heli.drawY;
          drawHelicopterSprite(heli, y);
          if (!ended && !portalEntry && Math.abs(heli.x - shipX) < 46 && Math.abs(y - shipY) < 29) {
            endGame();
          }
          if (heli.x < -60) helicopters.splice(i, 1);
        }
      }

      function drawWormhole(dt) {
        let spawnedNow = false;
        if (!wormhole && wallSpawned && !wormholeSpawned && elapsed >= wallSpawnTime + .5) {
          const wallHelicopter = helicopters.find(heli => heli.column);
          wormholeSpawned = true;
          if (wallHelicopter) {
            const rx = 46.5, ry = 25.5;
            const zone = Math.random() < .5 ? 'sky' : 'ground';
            const x = wallHelicopter.x - (30 + Math.random() * 70);
            wormhole = {
              rx, ry, zone,
              x: Math.max(rx, Math.min(w - rx, x)),
              y: zone === 'ground' ? groundY - 12 : ry + 8
            };
            spawnedNow = true;
          }
        }
        if (!wormhole) return;

        const { rx, ry, zone } = wormhole;
        if (!spawnedNow) wormhole.x -= 155 * difficulty() * dt;
        if (wormhole.x - rx < 0) { wormhole = null; return; }
        const { x, y } = wormhole;
        if (x - rx >= w) return;
        const palette = zone === 'sky'
          ? ['#536f78', '#91a6a3', '#d2aa76']
          : ['#b88358', '#a46d4c', '#d4a16a'];

        ctx.save();
        ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.clip();
        // Copy and twist the existing scene pixels so the wormhole is opaque,
        // while retaining the colors of the sky or ground underneath it.
        const left = Math.max(0, Math.floor((x - rx) * dpr));
        const top = Math.max(0, Math.floor((y - ry) * dpr));
        const patchWidth = Math.min(canvas.width - left, Math.ceil(rx * 2 * dpr));
        const patchHeight = Math.min(canvas.height - top, Math.ceil(ry * 2 * dpr));
        const patch = ctx.getImageData(left, top, patchWidth, patchHeight);
        const source = new Uint8ClampedArray(patch.data);
        for (let py = 0; py < patchHeight; py++) {
          for (let px = 0; px < patchWidth; px++) {
            const nx = ((left + px + .5) / dpr - x) / rx;
            const ny = ((top + py + .5) / dpr - y) / ry;
            const radius = Math.hypot(nx, ny);
            if (radius > 1) continue;
            const angle = Math.atan2(ny, nx) + (1 - radius) * (2.2 + Math.sin(elapsed) * .15);
            const sampleX = x + Math.cos(angle) * radius * rx;
            const sampleY = y + Math.sin(angle) * radius * ry;
            const sourceX = Math.max(0, Math.min(patchWidth - 1, Math.round(sampleX * dpr - left)));
            const sourceY = Math.max(0, Math.min(patchHeight - 1, Math.round(sampleY * dpr - top)));
            const targetIndex = (py * patchWidth + px) * 4;
            const sourceIndex = (sourceY * patchWidth + sourceX) * 4;
            patch.data[targetIndex] = source[sourceIndex];
            patch.data[targetIndex + 1] = source[sourceIndex + 1];
            patch.data[targetIndex + 2] = source[sourceIndex + 2];
            patch.data[targetIndex + 3] = 255;
          }
        }
        ctx.putImageData(patch, left, top);

        // Opaque-color spiral bands make the distortion read as a whirlpool.
        for (let arm = 0; arm < 3; arm++) {
          ctx.beginPath();
          const turns = Math.PI * 5;
          for (let t = 0; t <= turns; t += .08) {
            const radius = 1 - t / turns;
            const angle = t + elapsed * .9 + arm * Math.PI * 2 / 3;
            const px = x + Math.cos(angle) * rx * radius;
            const py = y + Math.sin(angle) * ry * radius;
            if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.globalAlpha = .48; ctx.strokeStyle = palette[arm]; ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.stroke();
        }
        for (let ring = 0; ring < 3; ring++) {
          const wobble = elapsed * .6 + ring * 1.7;
          ctx.beginPath();
          ctx.ellipse(x + Math.sin(wobble) * 3, y + Math.cos(wobble) * 2,
            rx * (.9 - ring * .2), ry * (.88 - ring * .18), Math.sin(wobble) * .12, 0, Math.PI * 2);
          ctx.globalAlpha = .28; ctx.strokeStyle = palette[(ring + 1) % palette.length]; ctx.lineWidth = 2; ctx.stroke();
        }
        ctx.restore();
      }

      function checkWormholeCollision() {
        if (!wormhole || wormhole.passedShip || ended || portalEntry) return;
        const shipX = Math.max(82, Math.min(130, w * .12));
        const overlaps = Math.abs(wormhole.x - shipX) < wormhole.rx + 31 &&
          Math.abs(wormhole.y - shipY) < wormhole.ry + 17;
        if (!overlaps) return;

        const enteringCorrectly = wormhole.zone === 'sky'
          ? shipY > wormhole.y && keys.has('ArrowUp')
          : shipY < wormhole.y && keys.has('ArrowDown');
        if (enteringCorrectly) {
          portalEntry = {
            age: 0, duration: 1.05,
            startX: shipX, startY: shipY,
            targetX: wormhole.x, targetY: wormhole.y
          };
          keys.clear();
        } else {
          // A side or wrong-direction hit passes through the portal and leaves
          // the helicopter wall ahead as the next obstacle.
          wormhole.passedShip = true;
        }
      }

      function drawMenuScene(dt) {
        drawBackground(dt); drawGround(dt);
        const shipX = w * .5;
        const shipMenuY = h * .46 + Math.sin(menuElapsed * 1.15) * 17 + Math.sin(menuElapsed * .53) * 6;
        if (menuElapsed >= nextMenuHelicopter) {
          const fromLeft = Math.random() < .5;
          const spawnY = h * (.2 + Math.random() * .48);
          helicopters.push({
            x: fromLeft ? -50 : w + 50,
            y: spawnY,
            phase: Math.random() * Math.PI * 2,
            speed: (115 + Math.random() * 115) * (fromLeft ? 1 : 1.5)
          });
          nextMenuHelicopter = menuElapsed + .25 + Math.random() * .35;
        }

        for (const heli of helicopters) {
          const dx = shipX - heli.x, dy = shipMenuY - heli.y;
          const distance = Math.hypot(dx, dy) || 1;
          heli.x += dx / distance * heli.speed * dt;
          heli.y += dy / distance * heli.speed * dt;
          heli.drawY = heli.y + Math.sin(menuElapsed * 3 + heli.phase) * 4;
        }

        const crashed = new Set();
        for (let i = 0; i < helicopters.length; i++) {
          const first = helicopters[i];
          for (let j = i + 1; j < helicopters.length; j++) {
            const second = helicopters[j];
            const separation = Math.hypot(first.x - second.x, first.drawY - second.drawY);
            const firstToShip = Math.hypot(first.x - shipX, first.drawY - shipMenuY);
            const secondToShip = Math.hypot(second.x - shipX, second.drawY - shipMenuY);
            if (separation < 48 && firstToShip > 94 && secondToShip > 94) {
              crashed.add(first); crashed.add(second);
              explosions.push({ x: (first.x + second.x) / 2, y: (first.drawY + second.drawY) / 2, age: 0 });
            }
          }
        }
        for (const heli of helicopters) {
          if (!crashed.has(heli) && Math.hypot(heli.x - shipX, heli.drawY - shipMenuY) < 94) {
            crashed.add(heli);
            explosions.push({ x: heli.x, y: heli.drawY, age: 0 });
          }
        }
        if (crashed.size) {
          for (const heli of crashed) spawnCrashDebris(heli);
          for (let i = helicopters.length - 1; i >= 0; i--) {
            if (crashed.has(helicopters[i])) helicopters.splice(i, 1);
          }
        }

        drawExplosions(dt);
        for (const heli of helicopters) {
          drawHelicopterSprite(heli, heli.drawY, heli.x < shipX);
        }
        drawDebris(dt);
        drawShip(shipX, shipMenuY);
      }

      function frame(now) {
        const frameDt = Math.min((now - (last || now)) / 1000, .04); last = now;
        const dt = ended || portalEntry ? 0 : frameDt;
        if (mode === 'ocean') {
          const oceanDt = ended ? 0 : frameDt;
          const shipSpeed = 285 * oceanDt;
          if (!ended && keys.has('ArrowLeft')) oceanShipX -= shipSpeed;
          if (!ended && keys.has('ArrowRight')) oceanShipX += shipSpeed;
          oceanShipX = Math.max(32, Math.min(w - 32, oceanShipX));
          if (!ended) {
            survivalTime += oceanDt;
            while (survivalTime >= 2) { survivalTime -= 2; addScore(1); }
          }
          drawOcean(oceanDt);
          drawOceanJets(oceanDt);
          drawOceanShip();
          oceanReveal = Math.min(1, oceanReveal + oceanDt / .9);
          if (oceanReveal < 1) {
            ctx.fillStyle = '#fff'; ctx.globalAlpha = 1 - oceanReveal; ctx.fillRect(0, 0, w, h); ctx.globalAlpha = 1;
          }
          requestAnimationFrame(frame);
          return;
        }
        if (mode === 'menu') {
          menuElapsed += frameDt; elapsed += frameDt;
          drawMenuScene(frameDt);
          requestAnimationFrame(frame);
          return;
        }
        elapsed += dt;
        if (!ended && !portalEntry) {
          survivalTime += dt;
          while (survivalTime >= 2) { survivalTime -= 2; addScore(1); }
          const speed = 255 * difficulty() * dt;
          if (keys.has('ArrowUp')) shipY -= speed;
          if (keys.has('ArrowDown')) shipY += speed;
          shipY = Math.max(75, Math.min(groundY - 47, shipY));
        }
        drawBackground(dt); drawGround(dt); drawHelicopters(dt); drawDebris(dt);
        if (portalEntry) {
          portalEntry.age += frameDt;
          const shipProgress = Math.min(1, portalEntry.age / .7);
          const eased = 1 - Math.pow(1 - shipProgress, 3);
          const x = portalEntry.startX + (portalEntry.targetX - portalEntry.startX) * eased;
          const y = portalEntry.startY + (portalEntry.targetY - portalEntry.startY) * eased;
          if (shipProgress < 1) drawShip(x, y, Math.max(.015, 1 - eased), 1 - eased);
          drawWormhole(0);
          const whiteFade = Math.min(1, Math.max(0, (portalEntry.age - .42) / .63));
          if (whiteFade > 0) {
            ctx.fillStyle = '#fff'; ctx.globalAlpha = whiteFade; ctx.fillRect(0, 0, w, h); ctx.globalAlpha = 1;
          }
          if (portalEntry.age >= portalEntry.duration) {
            mode = 'ocean'; portalEntry = null; oceanElapsed = 0; oceanScroll = 0;
            oceanShipX = w * .5; oceanShipY = h * .76; oceanReveal = 0; nextJet = 1.5;
            jets.length = 0; explosions.length = 0; debris.length = 0; keys.clear();
            document.body.classList.add('in-ocean');
          }
        } else {
          drawShip();
          drawWormhole(dt);
          checkWormholeCollision();
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
